# Banco de dados do Kairos. Funciona com Docker e com Podman:
#   docker compose up -d      ou      podman compose up -d
# Os valores abaixo têm padrão de desenvolvimento; para trocar, copie .env.example para .env.
name: kairos

services:
  db:
    # Nome completo da imagem: o Podman não completa "mysql:8.4" sozinho
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-kairos}
      MYSQL_USER: ${DB_USER:-kairos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kairos}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kairos-root}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Só esta máquina alcança o banco
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      # Os dados sobrevivem a "down"; "down -v" apaga
      - dbdata:/var/lib/mysql
      # Scripts executados em ordem alfabética, só quando o volume está vazio
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 força TCP: por socket o MySQL responde antes de terminar a inicialização
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

volumes:
  dbdata:
